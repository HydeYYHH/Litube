# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Never default to offline: AGP 8.10.1 was cached as POM/module only (no JAR),
# so --offline cannot resolve the Android Gradle Plugin.
org.gradle.offline=false
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Network / TLS (some regional mirrors need explicit protocols)
systemProp.jdk.tls.client.protocols=TLSv1.2,TLSv1.3

android.injected.testOnly=false
