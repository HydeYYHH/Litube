[versions]
agp = "8.10.1"
kotlin = "2.2.20"
koin = "4.1.0"
coreKtx = "1.16.0"
activityCompose = "1.10.1"
lifecycle = "2.9.1"
composeBom = "2025.06.01"
coroutines = "1.10.2"
junit = "4.13.2"
androidxTestExtJunit = "1.2.1"
androidxTestRunner = "1.6.2"
androidxTestCore = "1.6.1"
material = "1.12.0"
swiperefreshlayout = "1.1.0"
webkit = "1.14.0"
okhttp = "4.12.0"
gson = "2.13.2"
mmkv = "1.3.12"
media3 = "1.10.1"
room = "2.8.4"
ksp = "2.2.20-2.0.4"
workManager = "2.10.5"
nanohttpd = "2.3.1"
playServicesCast = "22.1.0"
# Declared explicitly because CastController uses androidx.mediarouter directly;
# cast-framework 22.1.0 pulls 1.8.0-beta01 transitively while 1.8.1 is what resolves.
mediarouter = "1.8.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
